schema_version = 1
project_root = "../.."
state_file = "target/gates/affected-state.json"

[[gate]]
name = "originals"
description = "Surviving binaries or provenance changed."
inputs = [
  "_originals",
  "java/reconstruction/builds.toml",
  "tools/originals/**/*.py",
]
commands = [
  ["just", "originals-verify"],
  ["just", "originals-verify-canfail"],
]

[[gate]]
name = "corpus"
description = "Build provenance, bytecode fingerprints, or resources changed."
inputs = [
  "_originals",
  "java/reconstruction/builds.toml",
  "tools/corpus/**/*.py",
]
commands = [
  ["just", "classify"],
  ["just", "classify-canfail"],
  ["just", "catalog"],
  ["just", "catalog-canfail"],
  ["just", "device-evidence"],
  ["just", "device-evidence-canfail"],
]

[[gate]]
name = "oracle-ast-harnesses"
description = "Reusable oracle or exhaustive AST ownership tooling changed."
inputs = [
  "tools/oracle",
  "tools/ast",
  "tools/port",
  "tools/tests",
]
commands = [
  ["just", "oracle-harness-canfail"],
  ["just", "crosswalk-check"],
  ["just", "crosswalk-canfail"],
  ["just", "crosswalk-fixture-canfail"],
  ["just", "port-gates-canfail"],
]

[[gate]]
name = "device-profiles"
description = "Handset fragments or per-build profile assignments changed."
inputs = [
  "device-profiles.toml",
  "java/reconstruction/builds.toml",
  "tools/device/validate_profiles.py",
  "tools/tests/test_device_profiles.py",
]
commands = [
  ["just", "device-profiles-check"],
  ["just", "device-profiles-canfail"],
]

[[gate]]
name = "architecture"
description = "Reusable crate boundaries or host-adapter dependencies changed."
inputs = [
  "Cargo.toml",
  "crates/**/Cargo.toml",
  "crates/**/src/**/*.rs",
  "tools/architecture/**/*.py",
  "tools/tests/test_architecture.py",
]
commands = [
  ["just", "architecture-check"],
  ["just", "architecture-canfail"],
]

[[gate]]
name = "rust"
description = "Pinned runtime dependency or transliteration scaffold changed."
inputs = [
  "Cargo.toml",
  "Cargo.lock",
  "transliteration/**/*.toml",
  "transliteration/**/*.rs",
]
commands = [
  ["cargo", "fmt", "--all", "--check"],
  ["cargo", "clippy", "--workspace", "--all-targets", "--", "-D", "warnings"],
  ["cargo", "test", "--workspace"],
]
