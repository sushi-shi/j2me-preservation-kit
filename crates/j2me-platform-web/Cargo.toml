[package]
name = "j2me-platform-web"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Browser adapters for the J2ME preservation runtime"
readme = "README.md"
keywords = ["j2me", "midp", "wasm", "webaudio", "browser"]
categories = ["game-development", "emulators", "wasm"]

[dependencies]
j2me-device = { path = "../j2me-device", version = "0.1.0" }
j2me-me = { path = "../j2me-me", version = "0.1.0" }
j2me-media = { path = "../j2me-media", version = "0.1.0" }
j2me-platform = { path = "../j2me-platform", version = "0.1.0" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "=0.2.121"

[target.'cfg(target_arch = "wasm32")'.dependencies.web-sys]
version = "0.3"
features = [
    "AudioBuffer",
    "AudioBufferSourceNode",
    "AudioContext",
    "AudioContextState",
    "AudioDestinationNode",
    "AudioNode",
    "AudioParam",
    "AudioScheduledSourceNode",
    "BaseAudioContext",
    "GainNode",
    "Navigator",
    "Window",
]
